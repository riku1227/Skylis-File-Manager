[package]
name = "explorer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
explorer-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel.workspace = true
anyhow.workspace = true
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
unicode-segmentation = "1.12"
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61.2"
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI Fast omits native text rendering unless explicitly enabled.
gpui_platform = { workspace = true, features = ["font-kit"] }
libc = "0.2"
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"
