[package]
name = "explorer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
explorer-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel.workspace = true
anyhow.workspace = true
chrono.workspace = true
image = { version = "0.25", default-features = false }
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
