[workspace]
resolver = "3"
members = ["crates/explorer-core", "apps/explorer"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
explorer-core = { path = "crates/explorer-core" }
# GPUIの依存窓口はここ1か所。エディションを替えるときは package を差し替える。
# GPUI Fast 0.1.15。core/platformは同じリリースで固定し、公開APIのaliasを保つ。
gpui = { package = "gpui-fast", version = "=0.1.15" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.15" }
async-channel = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[patch.crates-io]
# Pinned core-only runtime frame limit; see vendor/gpui-fast/SKYLIS-PATCH.md.
gpui-fast = { path = "vendor/gpui-fast" }

[profile.release]
debug = "line-tables-only"
