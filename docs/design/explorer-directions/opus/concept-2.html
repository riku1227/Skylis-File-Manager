<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trail — 重なる階層</title>
<style>
/* ===== 共有CSS（仮アイコン・プレビュー・レビュー用パネル） ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input{font:inherit;color:inherit}
:root{--fold-back:#e6a426;--fold-front:#f9c94c;--fold-hi:#fde08a;--fold-glyph:#9a6a0e}
:root[data-icons="mac"]{--fold-back:#4c9ce8;--fold-front:#7cbcf6;--fold-hi:#a6d3fa;--fold-glyph:#1f5fa8}
.ic{flex:none;display:block}
.obj{flex:none;display:block}
.thumb{flex:none;display:block;border-radius:4px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.18)}
.thumb .photo{display:block}
mark{background:var(--mark-bg,rgba(255,200,0,.42));color:inherit;border-radius:2px;padding:0 1px}
.os-mac-only{display:none!important}
:root[data-os="mac"] .os-mac-only{display:flex!important}
:root[data-os="mac"] .os-win-only{display:none!important}
.traffic{gap:8px;align-items:center}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.caption{display:flex;align-items:stretch;height:100%}
.caption button{width:46px;display:grid;place-items:center;color:var(--text-2)}
.caption button:hover{background:var(--hover)}
.caption button.close:hover{background:#c42b1c;color:#fff}

/* プレビュー */
.pv{position:relative;width:100%;aspect-ratio:16/11;border-radius:inherit;overflow:hidden;display:grid;place-items:center}
.pv .photo{width:100%;height:100%;display:block}
.pv-icon{flex-direction:column;align-content:center;gap:8px}
.pv-cap{font-size:12px;color:var(--text-2);text-align:center}
.pv-play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.38);display:grid;place-items:center;backdrop-filter:blur(6px)}
.pv-dur{position:absolute;right:10px;bottom:9px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.pv-doc .page{width:56%;aspect-ratio:1/1.3;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.12);padding:9% 9% 0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.pv-doc .pg-t{height:3px;width:30%;border-radius:2px}
.pv-doc .pg-h{font:600 9px/1.3 system-ui,"Yu Gothic UI",sans-serif;color:#222;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-doc i{display:block;height:3px;border-radius:2px;background:#dfe2e7;width:100%}
.pv-doc b{display:block;height:24px;border-radius:3px;background:#eef1f5;margin:3px 0}
.pv-sheet table{border-collapse:collapse;background:#fff;font:9.5px/1 system-ui,sans-serif;color:#333;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:3px;overflow:hidden}
.pv-sheet th{background:#eef4ef;color:#4b6b55;font-weight:600;padding:5px 9px;border:1px solid #dfe7e1}
.pv-sheet td{padding:5px 9px;border:1px solid #e6e8eb;text-align:right}
.pv-sheet td:first-child{text-align:left;color:#555}
.pv-slide .slide{width:80%;aspect-ratio:16/9;border-radius:4px;background:linear-gradient(135deg,#fff 55%,#ffe9e0);box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative;padding:7% 8%;overflow:hidden}
.sl-k{font:700 7px/1 system-ui;color:#d2522b;letter-spacing:.1em}
.sl-t{font:700 15px/1.2 system-ui,"Yu Gothic UI";color:#222;margin:5px 0 9px}
.sl-b i{display:block;height:3px;border-radius:2px;background:#e3e3e3;width:52%;margin-bottom:5px}
.sl-shape{position:absolute;right:-10%;bottom:-25%;width:46%;aspect-ratio:1;border-radius:50%;background:#d2522b;opacity:.85}
.pv-text{place-items:stretch;background:var(--code-bg,#fafafa)}
.pv-text pre{margin:0;padding:14px 16px;font:11.5px/1.6 "Cascadia Mono",Consolas,ui-monospace,monospace;color:var(--text);white-space:pre-wrap;overflow:hidden}

/* レビュー用パネル */
.rv-btn{position:fixed;right:10px;bottom:10px;z-index:90;width:22px;height:22px;border-radius:50%;font:600 12px/22px system-ui;text-align:center;color:#666;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.12);opacity:.55;cursor:pointer}
.rv-btn:hover{opacity:1}
:root[data-theme="dark"] .rv-btn{color:#bbb;background:rgba(30,30,30,.75);box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.rv-panel{position:fixed;right:12px;bottom:40px;z-index:91;width:340px;max-height:calc(100% - 60px);overflow:auto;background:#fffef8;color:#2b2a26;border:1px dashed #b9ac7a;border-radius:10px;padding:12px 14px 14px;font:12px/1.6 "Segoe UI","Yu Gothic UI",system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.rv-panel[hidden]{display:none}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv-x{font-size:16px;width:24px;height:24px;cursor:pointer}
.rv-k{font-weight:700;margin:10px 0 4px;color:#7a6a2f}
.rv-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.rv-seg{display:flex;border:1px solid #d8cfa6;border-radius:6px;overflow:hidden}
.rv-seg button{padding:2px 9px;cursor:pointer}.rv-seg button.on{background:#2b2a26;color:#fff}
.rv-note{margin:4px 0;color:#4a473c}
.rv-panel ul{margin:2px 0;padding-left:18px}

/* ===== 案2 Trail: 階層を「重なった紙」で見せ、操作は下部のコマンド島へ ===== */
:root{
  --font:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;
  --canvas:#e9e7e2; --card:#f6f5f1; --front:#ffffff; --spine:#efede8; --spine-2:#e6e3dd;
  --line:rgba(30,25,15,.08); --line-2:rgba(30,25,15,.14);
  --text:#16171b; --text-2:#5d616a; --text-3:#72767f;
  --accent:#0b7f60; --accent-hi:#14b38a; --on-accent:#ffffff; --accent-soft:rgba(11,127,96,.10);
  --hover:rgba(30,25,15,.045); --press:rgba(30,25,15,.08);
  --sel:#0b7f60; --sel-text:#ffffff; --sel-text-2:rgba(255,255,255,.78);
  --trail:rgba(11,127,96,.12);
  --island:#17181c; --island-2:#24262c; --island-text:#f2f3f5; --island-text-2:#a2a7b1; --island-edge:rgba(255,255,255,.08);
  --shadow-sheet:0 0 0 1px rgba(30,25,15,.05),0 2px 4px rgba(30,25,15,.04),0 18px 40px -12px rgba(30,25,15,.18);
  --shadow-front:0 0 0 1px rgba(30,25,15,.06),0 4px 10px rgba(30,25,15,.05),0 28px 60px -16px rgba(30,25,15,.28);
  --shadow-spine:-1px 0 0 rgba(255,255,255,.6) inset, 0 0 0 1px rgba(30,25,15,.06), 6px 0 18px -6px rgba(30,25,15,.18);
  --mark-bg:rgba(20,179,138,.28); --code-bg:#f4f3ef;
  --w-places:188px; --w-parent:224px; --w-pv:300px;
}
:root[data-theme="dark"]{
  --canvas:#0a0b0e; --card:#14161b; --front:#191c22; --spine:#101216; --spine-2:#0d0f12;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
  --text:#eef0f4; --text-2:#9aa1ad; --text-3:#7f8693;
  --accent:#45e0ad; --accent-hi:#7cf0c8; --on-accent:#03241a; --accent-soft:rgba(69,224,173,.12);
  --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --sel:#45e0ad; --sel-text:#03241a; --sel-text-2:rgba(3,36,26,.72);
  --trail:rgba(69,224,173,.13);
  --island:#22252c; --island-2:#2e3139; --island-edge:rgba(255,255,255,.1);
  --shadow-sheet:0 0 0 1px rgba(255,255,255,.04),0 18px 40px -12px rgba(0,0,0,.7);
  --shadow-front:0 0 0 1px rgba(255,255,255,.06),0 28px 60px -16px rgba(0,0,0,.85);
  --shadow-spine:-1px 0 0 rgba(255,255,255,.05) inset,0 0 0 1px rgba(255,255,255,.04),6px 0 18px -6px rgba(0,0,0,.8);
  --mark-bg:rgba(69,224,173,.3); --code-bg:#111317;
}
body{font:13px/1.45 var(--font);color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
.win{height:100vh;display:flex;padding:12px 12px 76px 0;position:relative;background:radial-gradient(1200px 400px at 50% 110%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 70%),var(--canvas)}

/* 場所（地の上に直接置く） */
.places{width:var(--w-places);flex:none;padding:2px 10px 0 14px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.places .traffic{padding:6px 4px 14px}
.ph{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text-3);padding:14px 8px 6px}
.ph:first-of-type{padding-top:8px}
.pl{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:9px;color:var(--text-2);white-space:nowrap;text-align:left;width:100%}
.pl:hover{background:var(--hover);color:var(--text)}
.pl.on{color:var(--text);background:var(--press);font-weight:600}
.pl.on .ic{color:var(--accent)}
.pl.drv{height:auto;padding:7px 8px;display:grid;grid-template-columns:16px 1fr;column-gap:10px}
.pl.drv .ic{grid-row:span 2}
.pl.drv span{overflow:hidden;text-overflow:ellipsis}
.mtr{height:3px;border-radius:3px;background:var(--line-2);margin-top:5px;overflow:hidden}
.mtr i{display:block;height:100%;background:var(--text-2);border-radius:3px}
.mtr.warn i{background:#f08a24}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px}
.tagrow span{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:12px;background:var(--hover);font-size:11.5px;color:var(--text-2)}
.tagrow i{width:8px;height:8px;border-radius:50%}

/* 階層の紙 */
.trail{flex:1;display:flex;min-width:0;align-items:stretch;padding-left:4px}
.spine{width:38px;flex:none;margin-right:-8px;border-radius:14px;background:var(--spine);box-shadow:var(--shadow-spine);display:flex;flex-direction:column;align-items:center;padding:12px 0 12px 0;gap:10px;color:var(--text-2);position:relative;cursor:pointer;overflow:hidden}
.spine:hover{color:var(--text);background:var(--spine-2)}
.spine .vt{writing-mode:vertical-rl;text-orientation:mixed;font-size:12.5px;letter-spacing:.06em;white-space:nowrap;padding-right:8px}
.spine .ic{margin-right:8px}
.sheet{border-radius:16px;display:flex;flex-direction:column;min-height:0;position:relative}
.parent{width:var(--w-parent);flex:none;background:var(--card);box-shadow:var(--shadow-sheet);margin-right:-12px;padding-right:12px}
.front{flex:1;min-width:0;background:var(--front);box-shadow:var(--shadow-front);z-index:3}
.sh-h{padding:14px 16px 8px;display:flex;align-items:center;gap:8px;min-height:46px;flex:none}
.sh-h .nm{font-weight:600;color:var(--text-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h .ct{color:var(--text-3);font-size:11.5px;margin-left:auto;white-space:nowrap}
.plist{overflow:auto;padding:0 6px 10px;flex:1}
.pr{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;white-space:nowrap;color:var(--text-2);position:relative}
.pr span{overflow:hidden;text-overflow:ellipsis;flex:1}
.pr:hover{background:var(--hover);color:var(--text)}
.pr .ic.chev{color:var(--text-3)}
.pr.trailon{background:var(--trail);color:var(--text);font-weight:600;margin-right:-18px;border-radius:8px 0 0 8px}
.pr.trailon .ic.chev{color:var(--accent)}

.fh{padding:18px 22px 6px;display:flex;align-items:flex-end;gap:14px;flex:none}
.fh h1{font:700 22px/1.2 var(--font-display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .meta{color:var(--text-3);font-size:12px;padding-bottom:3px;white-space:nowrap}
.fh .cap{margin:-18px -22px 0 auto;align-self:flex-start;height:34px}
.fh .cap button{width:44px}
.fh .cap button:first-child{border-top-left-radius:0}
.fh .cap button.close{border-top-right-radius:16px}
.qinfo{margin:2px 22px 4px;font-size:12px;color:var(--text-2)}
.listwrap{flex:1;min-height:0;overflow:auto;padding:4px 10px 14px;container-type:inline-size}
.lh,.row{display:grid;grid-template-columns:minmax(0,1fr) 140px 128px 84px;column-gap:14px;align-items:center;padding:0 12px}
.lh{height:30px;position:sticky;top:0;background:var(--front);z-index:2;font-size:11.5px;color:var(--text-3);box-shadow:0 1px 0 var(--line)}
.lh button{display:flex;align-items:center;gap:3px;white-space:nowrap;height:24px;border-radius:6px;padding:0 6px;margin:0 -6px}
.lh button:hover{background:var(--hover);color:var(--text)}
.lh button.on{color:var(--text);font-weight:600}
.lh .r,.row .r{display:flex;justify-content:flex-end}
.row{height:32px;border-radius:8px;margin-top:1px}
.row:hover{background:var(--hover)}
.row .n{display:flex;align-items:center;gap:10px;min-width:0}
.row .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row .dots{display:flex;gap:3px}.row .dots i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1.5px var(--front)}
.row.sel{background:var(--sel);color:var(--sel-text)}
.row.sel .c{color:var(--sel-text-2)}
.row.sel .dots i{box-shadow:0 0 0 1.5px var(--sel)}
.row.sel mark{background:rgba(0,0,0,.18)}
.row.sel+.row.sel{border-top-left-radius:0;border-top-right-radius:0;margin-top:0}
.row.sel:has(+.row.sel){border-bottom-left-radius:0;border-bottom-right-radius:0}
.row.focus{box-shadow:inset 0 0 0 2px var(--accent)}
.row .go{display:none;color:var(--text-3)}
.row:hover .go{display:block}
.row.sel .go{color:var(--sel-text-2)}
@container (max-width:600px){ .lh,.row{grid-template-columns:minmax(0,1fr) 128px 76px} .k{display:none} }
@container (max-width:400px){ .lh,.row{grid-template-columns:minmax(0,1fr) 76px} .m{display:none} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;padding:8px 2px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;text-align:center}
.tile:hover{background:var(--hover)}
.tile .tv{height:64px;display:grid;place-items:center}
.tile .thumb{border-radius:8px}
.tile span{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;padding:1px 6px;border-radius:6px}
.tile.sel{background:var(--accent-soft)}
.tile.sel span{background:var(--sel);color:var(--sel-text)}
.empty{display:grid;place-items:center;align-content:center;height:70%;color:var(--text-3);gap:8px}

/* プレビュー */
.pvcard{width:var(--w-pv);flex:none;margin-left:12px;background:var(--card);box-shadow:var(--shadow-sheet);overflow:hidden}
.pvcard .cap{position:absolute;top:0;right:0;height:34px;z-index:2}
.pvcard .cap button{width:44px}
.pvcard .cap button.close{border-top-right-radius:16px}
.pvtop{position:relative;padding:44px 18px 18px;display:grid;place-items:center}
.pvtop::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 55%, var(--glow,transparent), transparent 70%);opacity:.32;pointer-events:none}
.pvtop .frame{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 10px 30px -10px rgba(0,0,0,.35);background:var(--front)}
.pvbody{padding:0 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.pvbody h2{font:650 17px/1.3 var(--font-display);margin:0;word-break:break-all}
.pvbody .sub{color:var(--text-2);font-size:12px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pvbody .sub i{width:7px;height:7px;border-radius:50%;display:inline-block}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;border-radius:10px;background:var(--hover);font-size:11px;color:var(--text-2)}
.act:hover{background:var(--press);color:var(--text)}
.act.pri{background:var(--accent);color:var(--on-accent);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.kv dt{color:var(--text-3)}.kv dd{margin:0;word-break:break-all;font-variant-numeric:tabular-nums}

/* コマンド島 */
.island{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);height:50px;border-radius:25px;background:var(--island);color:var(--island-text);display:flex;align-items:center;gap:2px;padding:0 7px;box-shadow:0 0 0 1px var(--island-edge),0 10px 30px -6px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.2);z-index:20;white-space:nowrap}
.island button{height:36px;min-width:36px;border-radius:18px;display:grid;place-items:center;color:var(--island-text-2)}
.island button:hover{background:var(--island-2);color:var(--island-text)}
.island button:disabled{opacity:.3;background:none}
.island button.on{color:var(--island-text);background:var(--island-2)}
.island .div{width:1px;height:22px;background:var(--island-edge);margin:0 5px}
.isearch{display:flex;align-items:center;gap:9px;height:36px;width:340px;border-radius:18px;background:var(--island-2);padding:0 8px 0 13px;color:var(--island-text-2);margin:0 4px}
.isearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--island-text);font-size:13px}
.isearch input::placeholder{color:var(--island-text-2)}
.isearch:focus-within{box-shadow:0 0 0 2px var(--accent-hi)}
.isearch kbd{font:600 10.5px/1 var(--font);color:var(--island-text-2);background:rgba(255,255,255,.08);border-radius:5px;padding:3px 6px}
.isearch .clr{min-width:22px;height:22px}
.ipath{font-size:12px;color:var(--island-text-2);padding:0 8px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ipath b{color:var(--island-text);font-weight:600}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--island);color:var(--island-text);padding:8px 14px;border-radius:12px;font-size:12.5px;box-shadow:0 10px 30px -6px rgba(0,0,0,.4);z-index:21;white-space:nowrap}

@media (max-width:1180px){ :root{--w-places:168px;--w-pv:264px} .isearch{width:280px} .ipath{display:none} }
</style>
</head>
<body>
<div class="win" id="win">
  <nav class="places" id="places"></nav>
  <div class="trail" id="trail"></div>
  <aside class="sheet pvcard" id="pv"></aside>
  <div class="island" id="island">
    <button data-act="back" id="bk" title="戻る (Alt+←)"></button><button data-act="forward" id="fw" title="進む (Alt+→)"></button>
    <span class="ipath" id="ipath"></span>
    <label class="isearch"><span id="sic"></span><input data-search id="q" autocomplete="off" spellcheck="false"><span id="qx"></span></label>
    <span class="div"></span>
    <button data-act="view:list" id="vl" title="リスト"></button><button data-act="view:grid" id="vg" title="アイコン"></button>
    <span class="div"></span>
    <button data-act="pane" id="pp" title="プレビュー"></button><button data-act="theme" id="th" title="テーマ"></button><button id="mo" title="その他"></button>
  </div>
</div>
<script>
/* ===== 共有: サンプルデータ / アイコン / 状態管理（3案共通） ===== */
(function(){
'use strict';
const NOW = new Date(2026,10,15,10,0);
const T = (mo,d,h=12,mi=0,y=2026)=>new Date(y,mo-1,d,h,mi);
const KB=1024, MB=KB*1024, GB=MB*1024;

/* ---- ツリー（すべて架空） ---- */

/* ---- 書式 ---- */
const p2=n=>String(n).padStart(2,'0');
function fmtSize(b){ if(b==null) return ''; const f=(v,u)=>(v>=100?Math.round(v):v.toFixed(1))+' '+u; if(b<KB) return Math.round(b)+' B'; if(b<MB) return f(b/KB,'KB'); if(b<GB) return f(b/MB,'MB'); return f(b/GB,'GB'); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmtRel(d){ const y=new Date(NOW); y.setDate(y.getDate()-1); const hm=d.getHours()+':'+p2(d.getMinutes());
  if(sameDay(d,NOW)) return '今日 '+hm; if(sameDay(d,y)) return '昨日 '+hm; if(d.getFullYear()===NOW.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm; return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function fmtShort(d){ return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+d.getHours()+':'+p2(d.getMinutes()); }
function fmtFull(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+p2(d.getMinutes()); }
function dateGroup(d){ const days=Math.floor((new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days<=0) return {k:0,label:'今日'}; if(days===1) return {k:1,label:'昨日'}; if(days<7) return {k:2,label:'今週'}; if(d.getMonth()===NOW.getMonth()&&d.getFullYear()===NOW.getFullYear()) return {k:3,label:'今月'}; if(days<62) return {k:4,label:'先月'}; return {k:5,label:'それ以前'}; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(name,q){ if(!q) return esc(name); const i=name.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(name); return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length)); }

  else { body+='<circle cx="112" cy="'+(s.night?28:40)+'" r="'+(s.night?9:14)+'" fill="'+s.sun+'" opacity=".95"/>';
    if(s.night) body+='<g fill="#fff" opacity=".7"><circle cx="30" cy="20" r=".9"/><circle cx="58" cy="12" r=".7"/><circle cx="84" cy="24" r=".8"/><circle cx="140" cy="16" r=".7"/></g>';
    body+='<path d="M0 72 Q30 50 60 66 T120 60 T160 64 V110 H0z" fill="'+s.hills[0]+'"/>';
    if(s.sea) body+='<rect y="80" width="160" height="30" fill="'+s.hills[1]+'"/><path d="M96 86h32M88 94h48M100 102h24" stroke="'+s.sun+'" stroke-width="1.5" opacity=".6"/>';
    else body+='<path d="M0 88 Q40 70 80 84 T160 80 V110 H0z" fill="'+s.hills[1]+'"/>';

    if(s.night) body+='<g fill="#ffd36b" opacity=".8"><rect x="20" y="92" width="2" height="2"/><rect x="40" y="96" width="2" height="2"/><rect x="70" y="94" width="2" height="2"/><rect x="120" y="98" width="2" height="2"/></g>';
  }
  return '<svg class="photo" viewBox="0 0 160 110" width="'+w+'" height="'+h+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+body+'</svg>';
}

const params = new URLSearchParams(location.hash.slice(1));
const S = {
  path: params.get('path') || 'docs', back:[], fwd:[],
  sort:{key:'name', dir:1}, q:'', cat:'all', group:'date',

let renderFn = ()=>{}, gridColsFn = ()=>1, orderFn=null;

function node(id){ return byId.get(id); }
function cur(){ return node(S.path); }
function ancestors(id){ const a=[]; let n=node(id); while(n){ a.unshift(n); n=n.parent; } return a; }
function cmp(a,b){
  if(a.kind!==b.kind) return a.kind==='folder'?-1:1;
  const k=S.sort.key; let r=0;
  if(k==='name') r=a.name.localeCompare(b.name,'ja',{numeric:true});
  else if(k==='mod') r=a.mod-b.mod;
  else if(k==='size') r=sizeOf(a)-sizeOf(b);
  else if(k==='kind') r=kindOf(a).label.localeCompare(kindOf(b).label,'ja');
  if(r===0) r=a.name.localeCompare(b.name,'ja',{numeric:true});
  return r*S.sort.dir;
}
function visible(){
  const n=cur(); let list=(n.children||[]).slice();
  if(S.q){ const q=S.q.toLowerCase(); list=list.filter(c=>c.name.toLowerCase().includes(q)); }
  if(S.cat!=='all') list=list.filter(c=>kindOf(c).cat===S.cat);
  return list.sort(cmp);
}
function order(){ return orderFn ? orderFn() : visible(); }
function selectedNodes(){ return order().filter(n=>S.sel.has(n.id)); }

function render(){ document.documentElement.dataset.theme=S.theme; document.documentElement.dataset.os=S.os; document.documentElement.dataset.icons=S.folderStyle; renderFn(); }
const A = {
  open(id){ const n=node(id); if(!n) return; if(n.kind!=='folder'){ A.toast('「'+n.name+'」を既定のアプリで開く（試作では開きません）'); return; }
    if(id===S.path) return; S.back.push(S.path); S.fwd=[]; S.path=id; A.resetView(); render(); },
  go(id){ A.open(id); },
  resetView(){ S.sel.clear(); S.anchor=null; S.focus=null; S.q=''; S.cat='all'; const s=document.querySelector('[data-search]'); if(s) s.value=''; const l=order(); if(l.length){ S.focus=l[0].id; } },
  back(){ if(!S.back.length) return; S.fwd.push(S.path); S.path=S.back.pop(); A.resetView(); render(); },
  forward(){ if(!S.fwd.length) return; S.back.push(S.path); S.path=S.fwd.pop(); A.resetView(); render(); },
  up(){ const p=cur().parent; if(p){ const from=S.path; A.open(p.id); S.sel=new Set([from]); S.focus=from; S.anchor=from; render(); } },
  sortBy(key){ if(S.sort.key===key) S.sort.dir*=-1; else { S.sort.key=key; S.sort.dir= key==='name'||key==='kind'?1:-1; } render(); },
  query(q){ S.q=q; const l=order(); if(S.focus && !l.find(n=>n.id===S.focus)) S.focus=l[0]?l[0].id:null; for(const id of [...S.sel]) if(!l.find(n=>n.id===id)) S.sel.delete(id); render(); },
  cat(c){ S.cat=c; A.query(S.q); },

  move(delta, shift){ const l=order(); if(!l.length) return; const ids=l.map(n=>n.id); let i=ids.indexOf(S.focus); if(i<0) i=delta>0?-1:ids.length;

/* ---- キーボード ---- */
document.addEventListener('keydown', e=>{
  const t=e.target, inField = t.matches && t.matches('input,textarea');
  if((e.ctrlKey||e.metaKey) && (e.key==='f'||e.key==='k')){ e.preventDefault(); const s=document.querySelector('[data-search]'); if(s){ s.focus(); s.select(); } return; }
  if(inField){
    if(e.key==='Escape'){ if(t.value){ t.value=''; A.query(''); } else t.blur(); e.preventDefault(); }
    else if(e.key==='ArrowDown' || e.key==='Enter'){ e.preventDefault(); t.blur(); S.listFocused=true; if(!S.sel.size) A.move(1,false); else render(); }
    return;
  }
  if(e.key==='?' ){ Review.toggle(); return; }
  if(e.key==='/'){ e.preventDefault(); const s=document.querySelector('[data-search]'); if(s) s.focus(); return; }
  if(e.altKey && e.key==='ArrowLeft'){ e.preventDefault(); A.back(); return; }
  if(e.altKey && e.key==='ArrowRight'){ e.preventDefault(); A.forward(); return; }
  if(e.altKey && e.key==='ArrowUp'){ e.preventDefault(); A.up(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); A.back(); return; }
  const cols = S.view==='grid' ? Math.max(1, gridColsFn()) : 1;
  if(e.key==='ArrowDown'){ e.preventDefault(); A.move(cols, e.shiftKey); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); A.move(-cols, e.shiftKey); }
  else if(e.key==='ArrowRight' && S.view==='grid'){ e.preventDefault(); A.move(1, e.shiftKey); }
  else if(e.key==='ArrowLeft' && S.view==='grid'){ e.preventDefault(); A.move(-1, e.shiftKey); }
  else if(e.key==='Home'){ e.preventDefault(); A.move(-9999, e.shiftKey); }
  else if(e.key==='End'){ e.preventDefault(); A.move(9999, e.shiftKey); }
  else if(e.key==='Enter' && S.focus){ e.preventDefault(); A.open(S.focus); }
  else if((e.ctrlKey||e.metaKey) && e.key==='a'){ e.preventDefault(); A.all(); }
  else if(e.key==='Escape'){ A.clear(); }
});

  },
};
document.addEventListener('click', e=>{ const b=e.target.closest('[data-rv]'); if(!b) return; const [k,v]=b.dataset.rv.split(':'); if(k==='close') Review.toggle(false); else { A[k](v); Review.draw(); } });

window.X = { NOW, node, cur, ancestors, visible, order, selectedNodes, sizeOf, kindOf, CATS, PLACES, DRIVES, TAGS, KIND, fmtSize, fmtRel, fmtShort, fmtFull, dateGroup, esc, hl, ic, objIcon, photo, thumb, preview, isImage, S, A, Review, params,

<script>

function places(){

function trail(){

  }
  const l=order();
  h+='<section class="sheet front"><div class="fh"><h1>'+esc(n.name)+'</h1><span class="meta">'+(n.children||[]).length+' 項目 · '+fmtSize(sizeOf(n))+'</span>'+(S.pane?'':caption)+'</div>';
  if(S.q) h+='<div class="qinfo">「'+esc(S.q)+'」— '+l.length+' 件</div>';
  h+='<div class="listwrap" data-list>';
  if(!l.length) h+='<div class="empty">'+ic(S.q?'search':'folder',26)+'<div>'+(S.q?'一致する項目はありません':'このフォルダーは空です')+'</div></div>';
  else if(S.view==='list'){
    const col=(k,t)=>'<button data-act="sortBy:'+k+'" class="'+(S.sort.key===k?'on':'')+'">'+t+(S.sort.key===k?ic(S.sort.dir>0?'chevU':'chevD',12):'')+'</button>';
    h+='<div class="lh"><div>'+col('name','名前')+'</div><div class="m">'+col('mod','更新日時')+'</div><div class="k">'+col('kind','種類')+'</div><div class="r">'+col('size','サイズ')+'</div></div>';
    for(const c of l){ const s=S.sel.has(c.id);
      h+='<div class="row'+(s?' sel':'')+(S.focus===c.id&&!s&&S.sel.size?' focus':'')+'" data-id="'+c.id+'"><div class="n">'+thumb(c,18)+'<span>'+hl(c.name,S.q)+'</span>'+(c.tags?'<span class="dots">'+c.tags.map(t=>'<i style="background:'+TAGS.find(x=>x.id===t).color+'"></i>').join('')+'</span>':'')+(c.kind==='folder'?'<span class="go">'+ic('chevR',13)+'</span>':'')+'</div><div class="c m">'+fmtShort(c.mod)+'</div><div class="c k">'+kindOf(c).label+'</div><div class="c r">'+(c.kind==='file'?fmtSize(c.size):'—')+'</div></div>'; }
  } else {
    h+='<div class="grid" id="grid">'+l.map(c=>'<div class="tile'+(S.sel.has(c.id)?' sel':'')+'" data-id="'+c.id+'"><div class="tv">'+(X.isImage(c)?'<span class="thumb" style="width:80px;height:60px">'+X.photo(c.seed,80,60)+'</span>':objIcon(c,56))+'</div><span>'+hl(c.name,S.q)+'</span></div>').join('')+'</div>';
  }
  h+='</div></section>';
  const sc=$('trail').querySelector('.listwrap'); const st=sc?sc.scrollTop:0;
  $('trail').innerHTML=h; const ns=$('trail').querySelector('.listwrap'); if(ns) ns.scrollTop=st;
}
function pv(){
  const el=$('pv'); el.style.display=S.pane?'flex':'none'; if(!S.pane) return;
  const sel=X.selectedNodes(); let n=sel.length===1?sel[0]:null; let h=caption;
  const target = n || (sel.length?null:cur());
  if(target){ const k=kindOf(target); el.style.setProperty('--glow', target.kind==='folder'?'var(--fold-front)':(k.color||'#888'));
    h+='<div class="pvtop"><div class="frame">'+preview(target,264,182)+'</div></div><div class="pvbody"><div><h2>'+esc(target.name)+'</h2><div class="sub">'+k.label+' · '+fmtSize(sizeOf(target))+(target.tags?target.tags.map(t=>{const x=TAGS.find(y=>y.id===t);return ' <i style="background:'+x.color+'"></i>'+x.name;}).join(''):'')+'</div></div>';
    h+='<div class="acts"><button class="act pri" data-act="open:'+target.id+'">'+ic('external',16)+'開く</button><button class="act">'+ic('share',16)+'共有</button><button class="act">'+ic('copy',16)+'パス</button><button class="act">'+ic('more',16)+'その他</button></div>';
    h+='<dl class="kv"><dt>更新</dt><dd>'+fmtFull(target.mod)+'</dd><dt>作成</dt><dd>'+fmtFull(target.created)+'</dd>'+(target.kind==='folder'?'<dt>内容</dt><dd>'+(target.children||[]).length+' 項目</dd>':'<dt>サイズ</dt><dd>'+Math.round(target.size).toLocaleString()+' バイト</dd>')+(target.dim?'<dt>解像度</dt><dd>'+target.dim+'</dd>':'')+(target.author?'<dt>作成者</dt><dd>'+esc(target.author)+'</dd>':'')+'</dl></div>';
  } else { el.style.setProperty('--glow','var(--accent)'); const tot=sel.reduce((a,c)=>a+sizeOf(c),0);
    h+='<div class="pvtop"><div style="position:relative;height:150px;width:100%">'+sel.slice(0,4).map((c,i)=>'<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate('+(i*16-24)+'px,'+(i*-6+8)+'px) rotate('+(i*6-9)+'deg);background:var(--front);border-radius:10px;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,.25)">'+thumb(c,52)+'</div>').join('')+'</div></div><div class="pvbody"><div><h2>'+sel.length+' 項目を選択</h2><div class="sub">合計 '+fmtSize(tot)+'</div></div><div class="acts"><button class="act">'+ic('copy',16)+'コピー</button><button class="act">'+ic('arrowR',16)+'移動</button><button class="act">'+ic('share',16)+'共有</button><button class="act">'+ic('trash',16)+'削除</button></div></div>';
  }
  if(S.toast) h+='';
  el.innerHTML=h;
}
function island(){
  $('bk').innerHTML=ic('chevL',18); $('bk').disabled=!S.back.length;
  $('fw').innerHTML=ic('chevR',18); $('fw').disabled=!S.fwd.length;
  const anc=ancestors(S.path); $('ipath').innerHTML=anc.slice(-2).map((a,i,arr)=>i===arr.length-1?'<b>'+esc(a.name)+'</b>':esc(a.name)).join(' / ');
  $('sic').innerHTML=ic('search',15); $('q').placeholder=cur().name+'内を検索';
  $('qx').innerHTML=S.q?'<button class="clr" onclick="document.getElementById(\'q\').value=\'\';X.A.query(\'\')">'+ic('x',13)+'</button>':'<kbd>/</kbd>';
  $('vl').innerHTML=ic('list',17); $('vl').className=S.view==='list'?'on':'';
  $('vg').innerHTML=ic('grid',17); $('vg').className=S.view==='grid'?'on':'';
  $('pp').innerHTML=ic('panelR',17); $('pp').className=S.pane?'on':'';
  $('th').innerHTML=ic(S.theme==='dark'?'sun':'moon',17); $('mo').innerHTML=ic('more',17);
  let t=document.querySelector('.toast'); if(S.toast){ if(!t){ t=document.createElement('div'); t.className='toast'; $('win').appendChild(t);} t.textContent=S.toast; } else if(t) t.remove();
}
X.setGridCols(()=>{ const g=$('grid'); return g?getComputedStyle(g).gridTemplateColumns.split(' ').length:1; });
X.setRender(()=>{ places(); trail(); pv(); island(); });
addEventListener('resize', ()=>X.render());
X.Review.mount('<p class="rv-note"><b>案2 Trail（重なる階層）</b>— サイドバーとツールバーの「帯」をやめた大胆な構造案。今いるフォルダーの祖先が<b>重なった紙</b>として左に積まれ、遠い祖先は縦書きの「背表紙」に畳まれる。パンくずの代わりに紙そのものが現在地を示し、背表紙を押すとその階層へ戻る。検索・戻る/進む・表示切替は下部の<b>コマンド島</b>に集約。既定はダーク（ミント色の選択）。</p><ul class="rv-note"><li>リスト表示では ← で上の階層、→ でフォルダーに入る（列表示に近い操作）。</li><li>狭い幅では親の紙も背表紙に畳む。</li></ul>');
X.start();
})();
</script>
