<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spaces — 色のある場所</title>
<style>
/* ===== 共有CSS（仮アイコン・プレビュー・レビュー用パネル） ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input{font:inherit;color:inherit}
:root{--fold-back:#e6a426;--fold-front:#f9c94c;--fold-hi:#fde08a;--fold-glyph:#9a6a0e}
:root[data-icons="mac"]{--fold-back:#4c9ce8;--fold-front:#7cbcf6;--fold-hi:#a6d3fa;--fold-glyph:#1f5fa8}
.ic{flex:none;display:block}
.obj{flex:none;display:block}
.thumb{flex:none;display:block;border-radius:4px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.18)}
.thumb .photo{display:block}
mark{background:var(--mark-bg,rgba(255,200,0,.42));color:inherit;border-radius:2px;padding:0 1px}
.os-mac-only{display:none!important}
:root[data-os="mac"] .os-mac-only{display:flex!important}
:root[data-os="mac"] .os-win-only{display:none!important}
.traffic{gap:8px;align-items:center}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.caption{display:flex;align-items:stretch;height:100%}
.caption button{width:46px;display:grid;place-items:center;color:var(--text-2)}
.caption button:hover{background:var(--hover)}
.caption button.close:hover{background:#c42b1c;color:#fff}

/* プレビュー */
.pv{position:relative;width:100%;aspect-ratio:16/11;border-radius:inherit;overflow:hidden;display:grid;place-items:center}
.pv .photo{width:100%;height:100%;display:block}
.pv-icon{flex-direction:column;align-content:center;gap:8px}
.pv-cap{font-size:12px;color:var(--text-2);text-align:center}
.pv-play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.38);display:grid;place-items:center;backdrop-filter:blur(6px)}
.pv-dur{position:absolute;right:10px;bottom:9px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.pv-doc .page{width:56%;aspect-ratio:1/1.3;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.12);padding:9% 9% 0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.pv-doc .pg-t{height:3px;width:30%;border-radius:2px}
.pv-doc .pg-h{font:600 9px/1.3 system-ui,"Yu Gothic UI",sans-serif;color:#222;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-doc i{display:block;height:3px;border-radius:2px;background:#dfe2e7;width:100%}
.pv-doc b{display:block;height:24px;border-radius:3px;background:#eef1f5;margin:3px 0}
.pv-sheet table{border-collapse:collapse;background:#fff;font:9.5px/1 system-ui,sans-serif;color:#333;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:3px;overflow:hidden}
.pv-sheet th{background:#eef4ef;color:#4b6b55;font-weight:600;padding:5px 9px;border:1px solid #dfe7e1}
.pv-sheet td{padding:5px 9px;border:1px solid #e6e8eb;text-align:right}
.pv-sheet td:first-child{text-align:left;color:#555}
.pv-slide .slide{width:80%;aspect-ratio:16/9;border-radius:4px;background:linear-gradient(135deg,#fff 55%,#ffe9e0);box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative;padding:7% 8%;overflow:hidden}
.sl-k{font:700 7px/1 system-ui;color:#d2522b;letter-spacing:.1em}
.sl-t{font:700 15px/1.2 system-ui,"Yu Gothic UI";color:#222;margin:5px 0 9px}
.sl-b i{display:block;height:3px;border-radius:2px;background:#e3e3e3;width:52%;margin-bottom:5px}
.sl-shape{position:absolute;right:-10%;bottom:-25%;width:46%;aspect-ratio:1;border-radius:50%;background:#d2522b;opacity:.85}
.pv-text{place-items:stretch;background:var(--code-bg,#fafafa)}
.pv-text pre{margin:0;padding:14px 16px;font:11.5px/1.6 "Cascadia Mono",Consolas,ui-monospace,monospace;color:var(--text);white-space:pre-wrap;overflow:hidden}

/* レビュー用パネル */
.rv-btn{position:fixed;right:10px;bottom:10px;z-index:90;width:22px;height:22px;border-radius:50%;font:600 12px/22px system-ui;text-align:center;color:#666;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.12);opacity:.55;cursor:pointer}
.rv-btn:hover{opacity:1}
:root[data-theme="dark"] .rv-btn{color:#bbb;background:rgba(30,30,30,.75);box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.rv-panel{position:fixed;right:12px;bottom:40px;z-index:91;width:340px;max-height:calc(100% - 60px);overflow:auto;background:#fffef8;color:#2b2a26;border:1px dashed #b9ac7a;border-radius:10px;padding:12px 14px 14px;font:12px/1.6 "Segoe UI","Yu Gothic UI",system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.rv-panel[hidden]{display:none}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv-x{font-size:16px;width:24px;height:24px;cursor:pointer}
.rv-k{font-weight:700;margin:10px 0 4px;color:#7a6a2f}
.rv-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.rv-seg{display:flex;border:1px solid #d8cfa6;border-radius:6px;overflow:hidden}
.rv-seg button{padding:2px 9px;cursor:pointer}.rv-seg button.on{background:#2b2a26;color:#fff}
.rv-note{margin:4px 0;color:#4a473c}
.rv-panel ul{margin:2px 0;padding-left:18px}

/* ===== 案3 Spaces: 場所ごとの色・タブ・まとまりで探す ===== */
:root{
  --font:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;
  --frame:#ebe7e1; --surface:#fffdfa; --raise:#ffffff; --well:#f5f2ed;
  --line:rgba(60,40,20,.09); --line-2:rgba(60,40,20,.15);
  --text:#1d1a17; --text-2:#625b53; --text-3:#7a736b;
  --hover:rgba(60,40,20,.05); --press:rgba(60,40,20,.09);
  --shadow-1:0 1px 2px rgba(60,40,20,.08),0 0 0 1px rgba(60,40,20,.05);
  --shadow-2:0 2px 6px rgba(60,40,20,.06),0 12px 28px -10px rgba(60,40,20,.18);
  --mark-bg:rgba(255,190,0,.42); --code-bg:#faf7f2;
  --hue:#d4452f; --hue-2:#ef7d4f; --on-hue:#fff; --hue-text:#b6361f;
  --w-side:216px; --w-insp:296px;
}
:root[data-theme="dark"]{
  --frame:#131215; --surface:#1c1b20; --raise:#25242a; --well:#232228;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#f2eff4; --text-2:#aaa4ad; --text-3:#8d8792;
  --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
  --shadow-1:0 0 0 1px rgba(255,255,255,.06);
  --shadow-2:0 0 0 1px rgba(255,255,255,.06),0 14px 30px -10px rgba(0,0,0,.7);
  --mark-bg:rgba(255,190,0,.3); --code-bg:#18171b;
}
body{font:13px/1.45 var(--font);color:var(--text);background:var(--frame);-webkit-font-smoothing:antialiased}
.win{height:100vh;display:grid;grid-template-columns:var(--w-side) minmax(0,1fr);grid-template-rows:42px minmax(0,1fr);background:var(--frame)}

/* 左上: ナビ */
.lt{display:flex;align-items:center;gap:2px;padding:0 10px 0 12px}
.lt .traffic{margin-right:12px}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:disabled{opacity:.35;background:none}
.ib.on{background:var(--press);color:var(--text)}

/* タブ */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 0 0 2px;min-width:0}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border-radius:10px 10px 0 0;color:var(--text-2);max-width:200px;min-width:0;white-space:nowrap}
.tab span.t{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.on{background:var(--surface);color:var(--text);font-weight:600}
.tab.on::before,.tab.on::after{content:"";position:absolute;bottom:0;width:10px;height:10px;background:radial-gradient(circle at 0 0,transparent 10px,var(--surface) 10.5px)}
.tab.on::before{left:-10px;transform:scaleX(-1)}
.tab.on::after{right:-10px}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);visibility:hidden}
.tab.on .x,.tab:hover .x{visibility:visible}
.tab .x:hover{background:var(--press);color:var(--text)}
.tabs .ib{margin:0 0 3px 4px}
.tabs .fill{flex:1}
.tabs .caption{height:42px;align-self:flex-start}

.sq{flex:none;display:grid;place-items:center;border-radius:28%;color:#fff;background:linear-gradient(160deg,var(--c2),var(--c1));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.25)}

/* サイドバー（枠の上） */
.side{padding:6px 10px 12px 12px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.sh{font-size:11px;font-weight:600;color:var(--text-3);padding:14px 8px 5px}
.sh:first-child{padding-top:4px}
.si{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:9px;width:100%;text-align:left;white-space:nowrap}
.si:hover{background:var(--hover)}
.si.on{background:var(--surface);box-shadow:var(--shadow-1);font-weight:600}
.si .cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400}
.si.drv{height:auto;padding:7px 8px;align-items:flex-start}
.si.drv .w{flex:1;min-width:0}
.si.drv b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--line-2);margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--text-2)}
.bar.warn i{background:#e8590c}
.si small{color:var(--text-3);font-size:11px}
.tg{width:10px;height:10px;border-radius:50%;margin:0 6px}

/* 面 */
.surface{background:var(--surface);border-radius:12px 0 0 0;display:grid;grid-template-rows:50px minmax(0,1fr) 28px;min-width:0;min-height:0;box-shadow:-1px 0 0 var(--line)}
.tb{display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);min-width:0}
.path{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;flex:1}
.pc{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;white-space:nowrap;color:var(--text-2);flex:none}
.pc:hover{background:var(--hover);color:var(--text)}
.pc.last{color:var(--text);font-weight:600;background:var(--well)}
.path>.ic{color:var(--text-3);flex:none}
.path .ell{color:var(--text-3);padding:0 4px}
.search{display:flex;align-items:center;gap:8px;width:250px;height:32px;padding:0 10px;border-radius:9px;background:var(--well);color:var(--text-3);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search:focus-within{background:var(--raise);box-shadow:inset 0 0 0 1.5px var(--hue),0 0 0 3px color-mix(in srgb,var(--hue) 18%,transparent)}
.search .clr{width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.seg{display:flex;background:var(--well);border-radius:9px;padding:2px;gap:2px;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.seg button{height:28px;min-width:30px;padding:0 8px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text-2);font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:var(--shadow-1);font-weight:600}

.main{display:flex;min-height:0;min-width:0}
.content{flex:1;min-width:0;overflow:auto;position:relative;container-type:inline-size}
.wash{position:absolute;inset:0 0 auto 0;height:220px;background:radial-gradient(90% 100% at 0% 0%, color-mix(in srgb,var(--hue) 16%,transparent), transparent 70%),radial-gradient(60% 80% at 100% 0%, color-mix(in srgb,var(--hue-2) 10%,transparent), transparent 70%);pointer-events:none}
.hd{position:relative;display:flex;align-items:center;gap:14px;padding:22px 24px 14px}
.hd h1{font:700 24px/1.15 var(--font-display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .meta{color:var(--text-2);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt{min-width:0}
.hd .seg{margin-left:auto}
.blk{position:relative;padding:0 16px}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--text);padding:10px 8px 8px}
.lbl em{font-style:normal;font-weight:400;color:var(--text-3)}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 0 6px}
.fcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--raise);box-shadow:var(--shadow-1);min-width:0;text-align:left}
.fcard:hover{box-shadow:var(--shadow-2)}
.fcard .w{min-width:0}
.fcard b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard small{color:var(--text-3);font-size:11.5px}
.fcard.sel{background:var(--hue);color:var(--on-hue);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--hue) 60%,transparent)}
.fcard.sel small{color:color-mix(in srgb,var(--on-hue) 75%,transparent)}
.fcard .dots{margin-left:auto}
.lh,.row{display:grid;grid-template-columns:minmax(0,1fr) 128px 132px 80px;column-gap:14px;align-items:center;padding:0 10px}
.lh{position:sticky;top:0;z-index:3;height:30px;background:var(--surface);font-size:11.5px;color:var(--text-3);margin:6px -16px 0;padding:0 26px;box-shadow:0 1px 0 var(--line)}
.lh button{display:flex;align-items:center;gap:3px;height:24px;padding:0 6px;margin:0 -6px;border-radius:6px;white-space:nowrap}
.lh button:hover{background:var(--hover);color:var(--text)}
.lh button.on{color:var(--text);font-weight:600}
.lh .r,.row .r{display:flex;justify-content:flex-end}
.row{height:32px;border-radius:8px}
.row:hover{background:var(--hover)}
.row .n{display:flex;align-items:center;gap:10px;min-width:0}
.row .n span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .c{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row.sel{background:var(--hue);color:var(--on-hue)}
.row.sel .c{color:color-mix(in srgb,var(--on-hue) 78%,transparent)}
.row.sel mark{background:rgba(255,255,255,.3)}
.row.sel+.row.sel{border-top-left-radius:0;border-top-right-radius:0}
.row.sel:has(+.row.sel){border-bottom-left-radius:0;border-bottom-right-radius:0}
.row.focus{box-shadow:inset 0 0 0 2px var(--hue)}
.dots{display:flex;gap:3px;flex:none}.dots i{width:7px;height:7px;border-radius:50%}
.row.sel .dots,.fcard.sel .dots{background:rgba(255,255,255,.94);padding:2px 4px;border-radius:6px}
@container (max-width:600px){ .lh,.row{grid-template-columns:minmax(0,1fr) 120px 74px} .k{display:none} }
@container (max-width:400px){ .lh,.row{grid-template-columns:minmax(0,1fr) 74px} .m{display:none} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;text-align:center}
.tile:hover{background:var(--hover)}
.tile .tv{height:62px;display:grid;place-items:center}
.tile .thumb{border-radius:8px}
.tile span{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.tile.sel{background:var(--hue);color:var(--on-hue)}
.pad{height:24px}
.empty{position:relative;display:grid;place-items:center;gap:8px;padding:60px 0;color:var(--text-3)}

.insp{width:var(--w-insp);flex:none;border-left:1px solid var(--line);overflow:auto;position:relative;display:flex;flex-direction:column}
.insp .iw{position:absolute;inset:0 0 auto 0;height:180px;background:linear-gradient(180deg,color-mix(in srgb,var(--hue) 12%,transparent),transparent);pointer-events:none}
.insp .in{position:relative;padding:16px;display:flex;flex-direction:column;gap:14px}
.insp .frame{border-radius:12px;overflow:hidden;background:var(--raise);box-shadow:var(--shadow-2)}
.insp h2{font:650 16px/1.3 var(--font-display);margin:0;word-break:break-all}
.insp .sub{color:var(--text-2);font-size:12px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips span{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--well);font-size:11.5px;box-shadow:inset 0 0 0 1px var(--line)}
.chips i{width:7px;height:7px;border-radius:50%}
.btns{display:flex;gap:6px}
.btn{height:32px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:6px;background:var(--raise);box-shadow:var(--shadow-1);white-space:nowrap;font-size:12.5px}
.btn:hover{background:var(--well)}
.btn.pri{background:var(--hue);color:var(--on-hue);box-shadow:none;font-weight:600}
.btn.sqr{width:32px;padding:0;justify-content:center}
.props{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:12px;padding:12px;border-radius:10px;background:var(--well)}
.props dt{color:var(--text-3)}.props dd{margin:0;word-break:break-all;font-variant-numeric:tabular-nums}

.st{display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.st .f{flex:1}
.st b{font-weight:600;color:var(--text)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:8px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-2);z-index:30;white-space:nowrap}

@media (max-width:1180px){ :root{--w-side:192px;--w-insp:256px} .search{width:200px} .seg.grp button span{display:none} .hd{padding:18px 20px 10px} }
</style>
</head>
<body>
<div class="win" id="win">
  <div class="lt" id="lt"></div>
  <div class="tabs" id="tabs"></div>
  <nav class="side" id="side"></nav>
  <section class="surface">
    <div class="tb">
      <div class="path" id="path"></div>
      <label class="search"><span id="sic"></span><input data-search id="q" autocomplete="off" spellcheck="false"><span id="qx"></span></label>
      <div class="seg" id="vseg"></div>
      <button class="ib" id="pbtn" data-act="pane" title="詳細"></button>
      <button class="ib" id="tbtn" data-act="theme" title="テーマ"></button>
    </div>
    <div class="main">
      <div class="content" id="content" data-list></div>
      <aside class="insp" id="insp"></aside>
    </div>
    <div class="st" id="st"></div>
  </section>
</div>
<script>
/* ===== 共有: サンプルデータ / アイコン / 状態管理（3案共通） ===== */
(function(){
'use strict';
const NOW = new Date(2026,10,15,10,0);
const T = (mo,d,h=12,mi=0,y=2026)=>new Date(y,mo-1,d,h,mi);
const KB=1024, MB=KB*1024, GB=MB*1024;

/* ---- ツリー（すべて架空） ---- */
let _id=0;
function fo(name, mod, children=[], o={}){ return Object.assign({id:o.id||('n'+(++_id)), name, kind:'folder', mod, created:o.created||mod, children}, o); }
function fi(name, mod, size, o={}){ const ext=(name.split('.').pop()||'').toLowerCase(); return Object.assign({id:'n'+(++_id), name, kind:'file', ext, mod, created:o.created||new Date(mod.getTime()-86400000*9), size}, o); }

/* ---- 書式 ---- */
const p2=n=>String(n).padStart(2,'0');
function fmtSize(b){ if(b==null) return ''; const f=(v,u)=>(v>=100?Math.round(v):v.toFixed(1))+' '+u; if(b<KB) return Math.round(b)+' B'; if(b<MB) return f(b/KB,'KB'); if(b<GB) return f(b/MB,'MB'); return f(b/GB,'GB'); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmtRel(d){ const y=new Date(NOW); y.setDate(y.getDate()-1); const hm=d.getHours()+':'+p2(d.getMinutes());
  if(sameDay(d,NOW)) return '今日 '+hm; if(sameDay(d,y)) return '昨日 '+hm; if(d.getFullYear()===NOW.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm; return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function fmtShort(d){ return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+d.getHours()+':'+p2(d.getMinutes()); }
function fmtFull(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+p2(d.getMinutes()); }
function dateGroup(d){ const days=Math.floor((new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days<=0) return {k:0,label:'今日'}; if(days===1) return {k:1,label:'昨日'}; if(days<7) return {k:2,label:'今週'}; if(d.getMonth()===NOW.getMonth()&&d.getFullYear()===NOW.getFullYear()) return {k:3,label:'今月'}; if(days<62) return {k:4,label:'先月'}; return {k:5,label:'それ以前'}; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(name,q){ if(!q) return esc(name); const i=name.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(name); return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length)); }

  else { body+='<circle cx="112" cy="'+(s.night?28:40)+'" r="'+(s.night?9:14)+'" fill="'+s.sun+'" opacity=".95"/>';
    if(s.night) body+='<g fill="#fff" opacity=".7"><circle cx="30" cy="20" r=".9"/><circle cx="58" cy="12" r=".7"/><circle cx="84" cy="24" r=".8"/><circle cx="140" cy="16" r=".7"/></g>';
    body+='<path d="M0 72 Q30 50 60 66 T120 60 T160 64 V110 H0z" fill="'+s.hills[0]+'"/>';
    if(s.sea) body+='<rect y="80" width="160" height="30" fill="'+s.hills[1]+'"/><path d="M96 86h32M88 94h48M100 102h24" stroke="'+s.sun+'" stroke-width="1.5" opacity=".6"/>';
    else body+='<path d="M0 88 Q40 70 80 84 T160 80 V110 H0z" fill="'+s.hills[1]+'"/>';

    if(s.night) body+='<g fill="#ffd36b" opacity=".8"><rect x="20" y="92" width="2" height="2"/><rect x="40" y="96" width="2" height="2"/><rect x="70" y="94" width="2" height="2"/><rect x="120" y="98" width="2" height="2"/></g>';
  }
  return '<svg class="photo" viewBox="0 0 160 110" width="'+w+'" height="'+h+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+body+'</svg>';
}
function isImage(n){ return n.kind==='file' && kindOf(n).cat==='image'; }
function thumb(n, size){ if(isImage(n)) return '<span class="thumb" style="width:'+size+'px;height:'+size+'px">'+photo(n.seed, size, size)+'</span>'; return objIcon(n, size); }

/* ---- 状態 ---- */
const params = new URLSearchParams(location.hash.slice(1));
const S = {
  path: params.get('path') || 'docs', back:[], fwd:[],
  sort:{key:'name', dir:1}, q:'', cat:'all', group:'date',
  sel:new Set(), anchor:null, focus:null,
  view: params.get('view') || 'list', pane: params.get('pane')!=='0',
  theme: params.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),
  os: params.get('os') || 'win', folderStyle: params.get('icons') || 'win',
  listFocused: true, toast:null,
};
let renderFn = ()=>{}, gridColsFn = ()=>1, orderFn=null;

function node(id){ return byId.get(id); }
function cur(){ return node(S.path); }
function ancestors(id){ const a=[]; let n=node(id); while(n){ a.unshift(n); n=n.parent; } return a; }
function cmp(a,b){
  if(a.kind!==b.kind) return a.kind==='folder'?-1:1;
  const k=S.sort.key; let r=0;
  if(k==='name') r=a.name.localeCompare(b.name,'ja',{numeric:true});
  else if(k==='mod') r=a.mod-b.mod;
  else if(k==='size') r=sizeOf(a)-sizeOf(b);
  else if(k==='kind') r=kindOf(a).label.localeCompare(kindOf(b).label,'ja');
  if(r===0) r=a.name.localeCompare(b.name,'ja',{numeric:true});
  return r*S.sort.dir;
}
function visible(){
  const n=cur(); let list=(n.children||[]).slice();
  if(S.q){ const q=S.q.toLowerCase(); list=list.filter(c=>c.name.toLowerCase().includes(q)); }
  if(S.cat!=='all') list=list.filter(c=>kindOf(c).cat===S.cat);
  return list.sort(cmp);
}
function order(){ return orderFn ? orderFn() : visible(); }
function selectedNodes(){ return order().filter(n=>S.sel.has(n.id)); }

function render(){ document.documentElement.dataset.theme=S.theme; document.documentElement.dataset.os=S.os; document.documentElement.dataset.icons=S.folderStyle; renderFn(); }
const A = {
  open(id){ const n=node(id); if(!n) return; if(n.kind!=='folder'){ A.toast('「'+n.name+'」を既定のアプリで開く（試作では開きません）'); return; }
    if(id===S.path) return; S.back.push(S.path); S.fwd=[]; S.path=id; A.resetView(); render(); },
  go(id){ A.open(id); },
  resetView(){ S.sel.clear(); S.anchor=null; S.focus=null; S.q=''; S.cat='all'; const s=document.querySelector('[data-search]'); if(s) s.value=''; const l=order(); if(l.length){ S.focus=l[0].id; } },
  back(){ if(!S.back.length) return; S.fwd.push(S.path); S.path=S.back.pop(); A.resetView(); render(); },
  forward(){ if(!S.fwd.length) return; S.back.push(S.path); S.path=S.fwd.pop(); A.resetView(); render(); },
  up(){ const p=cur().parent; if(p){ const from=S.path; A.open(p.id); S.sel=new Set([from]); S.focus=from; S.anchor=from; render(); } },
  sortBy(key){ if(S.sort.key===key) S.sort.dir*=-1; else { S.sort.key=key; S.sort.dir= key==='name'||key==='kind'?1:-1; } render(); },
  query(q){ S.q=q; const l=order(); if(S.focus && !l.find(n=>n.id===S.focus)) S.focus=l[0]?l[0].id:null; for(const id of [...S.sel]) if(!l.find(n=>n.id===id)) S.sel.delete(id); render(); },
  cat(c){ S.cat=c; A.query(S.q); },
  click(id, e){ const l=order(); const ids=l.map(n=>n.id);
    if(e && (e.ctrlKey||e.metaKey)){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.anchor=id; }
    else if(e && e.shiftKey && S.anchor && ids.includes(S.anchor)){ const a=ids.indexOf(S.anchor), b=ids.indexOf(id); S.sel=new Set(ids.slice(Math.min(a,b), Math.max(a,b)+1)); }
    else { S.sel=new Set([id]); S.anchor=id; }
    S.focus=id; S.listFocused=true; render(); },
  move(delta, shift){ const l=order(); if(!l.length) return; const ids=l.map(n=>n.id); let i=ids.indexOf(S.focus); if(i<0) i=delta>0?-1:ids.length;
    if(S.sel.size || shift || Math.abs(delta)>1000 || ids.indexOf(S.focus)<0) i=Math.max(0, Math.min(ids.length-1, i+delta)); const id=ids[i];
    if(shift){ if(!S.anchor) S.anchor=S.focus||id; const a=ids.indexOf(S.anchor); S.sel=new Set(ids.slice(Math.min(a,i), Math.max(a,i)+1)); }
    else { S.sel=new Set([id]); S.anchor=id; }
    S.focus=id; render(); const el=document.querySelector('[data-id="'+CSS.escape(id)+'"]'); if(el) el.scrollIntoView({block:'nearest'}); },
  all(){ S.sel=new Set(order().map(n=>n.id)); render(); },
  clear(){ S.sel.clear(); render(); },
  view(v){ S.view=v; render(); },
  pane(v){ S.pane = v==null ? !S.pane : v; render(); },
  theme(t){ S.theme = t || (S.theme==='dark'?'light':'dark'); render(); },
  os(o){ S.os=o; render(); }, icons(s){ S.folderStyle=s; render(); },
  group(g){ S.group=g; render(); },

};

/* ---- キーボード ---- */
document.addEventListener('keydown', e=>{
  const t=e.target, inField = t.matches && t.matches('input,textarea');
  if((e.ctrlKey||e.metaKey) && (e.key==='f'||e.key==='k')){ e.preventDefault(); const s=document.querySelector('[data-search]'); if(s){ s.focus(); s.select(); } return; }
  if(inField){
    if(e.key==='Escape'){ if(t.value){ t.value=''; A.query(''); } else t.blur(); e.preventDefault(); }
    else if(e.key==='ArrowDown' || e.key==='Enter'){ e.preventDefault(); t.blur(); S.listFocused=true; if(!S.sel.size) A.move(1,false); else render(); }
    return;
  }
  if(e.key==='?' ){ Review.toggle(); return; }
  if(e.key==='/'){ e.preventDefault(); const s=document.querySelector('[data-search]'); if(s) s.focus(); return; }
  if(e.altKey && e.key==='ArrowLeft'){ e.preventDefault(); A.back(); return; }
  if(e.altKey && e.key==='ArrowRight'){ e.preventDefault(); A.forward(); return; }
  if(e.altKey && e.key==='ArrowUp'){ e.preventDefault(); A.up(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); A.back(); return; }
  const cols = S.view==='grid' ? Math.max(1, gridColsFn()) : 1;
  if(e.key==='ArrowDown'){ e.preventDefault(); A.move(cols, e.shiftKey); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); A.move(-cols, e.shiftKey); }
  else if(e.key==='ArrowRight' && S.view==='grid'){ e.preventDefault(); A.move(1, e.shiftKey); }
  else if(e.key==='ArrowLeft' && S.view==='grid'){ e.preventDefault(); A.move(-1, e.shiftKey); }
  else if(e.key==='Home'){ e.preventDefault(); A.move(-9999, e.shiftKey); }
  else if(e.key==='End'){ e.preventDefault(); A.move(9999, e.shiftKey); }
  else if(e.key==='Enter' && S.focus){ e.preventDefault(); A.open(S.focus); }
  else if((e.ctrlKey||e.metaKey) && e.key==='a'){ e.preventDefault(); A.all(); }
  else if(e.key==='Escape'){ A.clear(); }
});

});

document.addEventListener('input', e=>{ if(e.target.matches('[data-search]')) A.query(e.target.value); });

/* ---- レビュー用パネル（本体の外。? キーまたは右下の小ボタン） ---- */
const Review = {
  html:'', open:false,
  mount(html){ Review.html=html; const b=document.createElement('button'); b.className='rv-btn'; b.title='試作メモ（?）'; b.textContent='?'; b.onclick=()=>Review.toggle(); if(params.get('shot')==='1') b.style.display='none'; document.body.appendChild(b);

  draw(){ const p=Review.el; if(!p) return; p.hidden=!Review.open; if(!Review.open) return;
    const seg=(name,cur,opts)=>'<div class="rv-seg">'+opts.map(([v,l])=>'<button data-rv="'+name+':'+v+'" class="'+(cur===v?'on':'')+'">'+l+'</button>').join('')+'</div>';
    p.innerHTML='<div class="rv-h"><b>試作メモ（レビュー用）</b><button class="rv-x" data-rv="close:">×</button></div>'+Review.html+
      '<div class="rv-k">表示の切替</div><div class="rv-row"><span>テーマ</span>'+seg('theme',S.theme,[['light','ライト'],['dark','ダーク']])+'</div>'+
      '<div class="rv-row"><span>OS</span>'+seg('os',S.os,[['win','Windows'],['mac','macOS']])+'</div>'+
      '<div class="rv-row"><span>仮フォルダー色</span>'+seg('icons',S.folderStyle,[['win','Windows風'],['mac','macOS風']])+'</div>'+
      '<p class="rv-note">ファイル・フォルダー・ドライブのカラーアイコンと写真サムネイルは<b>すべて仮素材</b>（実在OSアイコン未取得）。実装ではOSのシェルアイコン／サムネイルに置き換わる。操作アイコンは自作の線画SVG。データはすべて架空。</p>'+
      '<div class="rv-k">キー操作</div><p class="rv-note">↑↓（グリッドは←→も）移動 / Shift 範囲 / Ctrl+クリック 追加 / Enter・ダブルクリック 開く / Backspace・Alt+← 戻る / Alt+↑ 上へ / Ctrl+F・/ 検索 / Ctrl+A 全選択 / Esc 解除 / ? このメモ</p>';
  },
};
document.addEventListener('click', e=>{ const b=e.target.closest('[data-rv]'); if(!b) return; const [k,v]=b.dataset.rv.split(':'); if(k==='close') Review.toggle(false); else { A[k](v); Review.draw(); } });

window.X = { NOW, node, cur, ancestors, visible, order, selectedNodes, sizeOf, kindOf, CATS, PLACES, DRIVES, TAGS, KIND, fmtSize, fmtRel, fmtShort, fmtFull, dateGroup, esc, hl, ic, objIcon, photo, thumb, preview, isImage, S, A, Review, params,
  setRender(fn){ renderFn=fn; }, setGridCols(fn){ gridColsFn=fn; }, setOrder(fn){ orderFn=fn; }, render,
  start(){ const l=order(); if(params.get('sel')){ const n=l.find(x=>x.name===params.get('sel')); if(n){ S.sel.add(n.id); S.focus=n.id; S.anchor=n.id; } } else if(l.length){ S.focus=null; } if(params.get('q')){ S.q=params.get('q'); const s=document.querySelector('[data-search]'); if(s) s.value=S.q; } render(); Review.draw(); const se=document.querySelector('[data-list] .sel'); if(se) se.scrollIntoView({block:'nearest'}); } };
})();

<script>

if(!X.params.get('sort')) S.sort={key:'mod',dir:-1};

  home:['#a77bff','#6f42c1','#6f42c1','#fff','#b597ff','#1c0f33'],

function hueKey(id){ for(const a of ancestors(id).reverse()){ if(HUES[a.id]) return a.id; } return 'other'; }
function sq(key, size, glyph){ const h=HUES[key]||HUES.other; return '<span class="sq" style="--c1:'+h[1]+';--c2:'+h[0]+';width:'+size+'px;height:'+size+'px">'+ic(glyph, Math.round(size*.62), 'stroke-width="2"')+'</span>'; }

let tabs=[{path:'docs'},{path:'pics'},{path:proj.id}], at=0;
{ const ti=tabs.findIndex(t=>t.path===S.path); if(ti>=0) at=ti; }
const tagDots = n => n.tags ? '<span class="dots">'+n.tags.map(t=>'<i style="background:'+TAGS.find(x=>x.id===t).color+'"></i>').join('')+'</span>' : '';

/* 表示順（棚のフォルダー → グループ化したファイル）をキーボード移動にも使う */
function groups(){
  const l=visible(); const folders=l.filter(n=>n.kind==='folder'); const files=l.filter(n=>n.kind!=='folder');
  let gs=[];
  if(S.group==='date'){ const m=new Map(); files.slice().sort((a,b)=>S.sort.key==='name'&&S.sort.dir===1&&false?0:0).forEach(f=>{ const g=dateGroup(f.mod); if(!m.has(g.k)) m.set(g.k,{label:g.label,k:g.k,items:[]}); m.get(g.k).items.push(f); }); gs=[...m.values()].sort((a,b)=>a.k-b.k); }
  else if(S.group==='kind'){ const order=['doc','sheet','slide','image','video','archive','app','other']; const names={doc:'書類',sheet:'表・データ',slide:'スライド',image:'画像',video:'動画',archive:'圧縮ファイル',app:'アプリ・スクリプト',other:'その他'}; const m=new Map(); files.forEach(f=>{ const c=kindOf(f).cat; if(!m.has(c)) m.set(c,{label:names[c]||c,k:order.indexOf(c),items:[]}); m.get(c).items.push(f); }); gs=[...m.values()].sort((a,b)=>a.k-b.k); }

document.addEventListener('click', e=>{

  const p=e.target.closest('[data-place]'); if(p){ A.open(p.dataset.place); }
});

function lt(){ $('lt').innerHTML='<div class="traffic os-mac-only"><i></i><i></i><i></i></div><button class="ib" data-act="back" title="戻る (Alt+←)"'+(S.back.length?'':' disabled')+'>'+ic('chevL',17)+'</button><button class="ib" data-act="forward" title="進む (Alt+→)"'+(S.fwd.length?'':' disabled')+'>'+ic('chevR',17)+'</button><button class="ib" data-act="up" title="上へ (Alt+↑)"'+(cur().parent?'':' disabled')+'>'+ic('arrowUp',16)+'</button>'; }
function tabsR(){
  tabs[at].path=S.path;
  $('tabs').innerHTML=tabs.map((t,i)=>{ const n=node(t.path); return '<div class="tab'+(i===at?' on':'')+'" data-tab="'+i+'">'+sq(hueKey(t.path),16,glyphOf(t.path))+'<span class="t">'+esc(n.name)+'</span><span class="x" title="タブを閉じる">'+ic('x',12)+'</span></div>'; }).join('')+'<button class="ib" data-newtab title="新しいタブ">'+ic('plus',16)+'</button><span class="fill"></span><div class="caption os-win-only"><button title="最小化">'+ic('minus',14)+'</button><button title="最大化">'+ic('square',12)+'</button><button class="close" title="閉じる">'+ic('x',15)+'</button></div>';
}
function side(){
  const hk=hueKey(S.path);
  let h='<div class="sh">よく使う場所</div>';
  for(const p of PLACES) h+='<button class="si'+(S.path===p.id?' on':'')+'" data-place="'+p.id+'">'+sq(p.id,22,p.icon)+'<span>'+p.name+'</span><span class="cnt">'+node(p.id).children.length+'</span></button>';
  h+='<div class="sh">ドライブ</div>';
  for(const id of DRIVES){ const d=node(id),u=1-d.free/d.total; h+='<button class="si drv'+(S.path===id?' on':'')+'" data-place="'+id+'">'+sq('other',22,'drive')+'<span class="w"><b>'+esc(d.name)+'</b><span class="bar'+(u>.9?' warn':'')+'" style="display:block"><i style="width:'+(u*100).toFixed(0)+'%"></i></span><small>空き '+fmtSize(d.free)+' / '+fmtSize(d.total)+'</small></span></button>'; }
  h+='<div class="sh">タグ</div>'+TAGS.map(t=>'<button class="si"><i class="tg" style="background:'+t.color+'"></i>'+t.name+'</button>').join('');
  $('side').innerHTML=h;
}
function tb(){
  const a=ancestors(S.path); let h='';
  const narrow=innerWidth<1180; let ell=false;
  a.forEach((n,i)=>{ const last=i===a.length-1; const mid=!last&&i>0&&i<a.length-2;
    if(narrow&&mid){ if(!ell){ ell=true; h+=ic('chevR',12)+'<button class="pc" data-go="'+a[a.length-3].id+'" title="'+esc(a.slice(1,-2).map(x=>x.name).join(' › '))+'">…</button>'; } return; }
    if(i) h+=ic('chevR',12); h+='<button class="pc'+(last?' last':'')+'" data-go="'+n.id+'">'+(i===0?ic('pc',14):last?sq(hueKey(n.id),16,glyphOf(n.id)):'')+esc(n.name)+'</button>'; });
  $('path').innerHTML=h;
  $('sic').innerHTML=ic('search',15); $('q').placeholder=cur().name+'内を検索';
  $('qx').innerHTML=S.q?'<button class="clr" onclick="document.getElementById(\'q\').value=\'\';X.A.query(\'\')">'+ic('x',13)+'</button>':'';
  $('vseg').innerHTML='<button data-act="view:list" class="'+(S.view==='list'?'on':'')+'" title="リスト">'+ic('list',16)+'</button><button data-act="view:grid" class="'+(S.view==='grid'?'on':'')+'" title="アイコン">'+ic('grid',16)+'</button>';
  $('pbtn').innerHTML=ic('panelR',17); $('pbtn').className='ib'+(S.pane?' on':'');
  $('tbtn').innerHTML=ic(S.theme==='dark'?'sun':'moon',17);
}
function content(){
  const n=cur(), hk=hueKey(S.path), H=HUES[hk], dark=S.theme==='dark';
  const w=$('win'); w.style.setProperty('--hue', dark?H[4]:H[2]); w.style.setProperty('--hue-2', H[0]); w.style.setProperty('--on-hue', dark?H[5]:H[3]);
  const {folders,gs}=groups(); const all=n.children||[];
  const latest = all.length ? all.reduce((a,c)=>c.mod>a.mod?c:a) : null;
  let h='<div class="wash"></div><div class="hd">'+sq(hk,44,glyphOf(S.path))+'<div class="tt"><h1>'+esc(n.name)+'</h1><div class="meta">'+all.length+' 項目 · '+fmtSize(sizeOf(n))+(latest?' · 最終更新 '+fmtRel(latest.mod):'')+'</div></div>';
  h+='<div class="seg grp" data-keep><button data-act="group:date" class="'+(S.group==='date'?'on':'')+'">'+ic('clock',14)+'<span>日付</span></button><button data-act="group:kind" class="'+(S.group==='kind'?'on':'')+'">'+ic('layers',14)+'<span>種類</span></button><button data-act="group:none" class="'+(S.group==='none'?'on':'')+'">'+ic('list',14)+'<span>なし</span></button></div></div>';
  if(!folders.length && !gs.length){ h+='<div class="empty">'+ic(S.q?'search':'folder',28)+'<div>'+(S.q?'「'+esc(S.q)+'」に一致する項目はありません':'このフォルダーは空です')+'</div></div>'; }
  h+='<div class="blk">';
  if(folders.length){ h+='<div class="lbl">フォルダー <em>'+folders.length+'</em></div>';
    if(S.view==='list') h+='<div class="shelf">'+folders.map(f=>'<button class="fcard'+(S.sel.has(f.id)?' sel':'')+(S.focus===f.id&&!S.sel.has(f.id)&&S.sel.size?' focus':'')+'" data-id="'+f.id+'">'+objIcon(f,30)+'<span class="w"><b>'+hl(f.name,S.q)+'</b><small>'+(f.children||[]).length+' 項目</small></span>'+tagDots(f)+'</button>').join('')+'</div>';
    else h+='<div class="grid">'+folders.map(tile).join('')+'</div>'; }
  if(gs.length){
    if(S.view==='list'){ const col=(k,t)=>'<button data-act="sortBy:'+k+'" class="'+(S.sort.key===k?'on':'')+'">'+t+(S.sort.key===k?ic(S.sort.dir>0?'chevU':'chevD',12):'')+'</button>';
      h+='<div class="lh" data-keep><div>'+col('name','名前')+'</div><div class="m">'+col('mod','更新日時')+'</div><div class="k">'+col('kind','種類')+'</div><div class="r">'+col('size','サイズ')+'</div></div>'; }
    for(const g of gs){ h+='<div class="lbl">'+g.label+' <em>'+g.items.length+'</em></div>';
      if(S.view==='list') h+=g.items.map(c=>{ const s=S.sel.has(c.id); return '<div class="row'+(s?' sel':'')+(S.focus===c.id&&!s&&S.sel.size?' focus':'')+'" data-id="'+c.id+'"><div class="n">'+thumb(c,18)+'<span>'+hl(c.name,S.q)+'</span>'+tagDots(c)+'</div><div class="c m">'+fmtRel(c.mod)+'</div><div class="c k">'+kindOf(c).label+'</div><div class="c r">'+fmtSize(c.size)+'</div></div>'; }).join('');
      else h+='<div class="grid" data-grid>'+g.items.map(tile).join('')+'</div>'; }
  }
  h+='</div><div class="pad"></div>';
  const el=$('content'), st=el.scrollTop; el.innerHTML=h; el.scrollTop=st;
}
function tile(c){ return '<div class="tile'+(S.sel.has(c.id)?' sel':'')+'" data-id="'+c.id+'"><div class="tv">'+(X.isImage(c)?'<span class="thumb" style="width:80px;height:60px">'+X.photo(c.seed,80,60)+'</span>':objIcon(c,54))+'</div><span>'+hl(c.name,S.q)+'</span></div>'; }
function insp(){
  const el=$('insp'); el.style.display=S.pane?'flex':'none'; if(!S.pane) return;
  const sel=X.selectedNodes(); let h='<div class="iw"></div><div class="in">';
  const n = sel.length===1?sel[0]:(sel.length?null:cur());
  if(n){ const k=kindOf(n);
    h+='<div class="frame">'+preview(n,264,182)+'</div><div><h2>'+esc(n.name)+'</h2><div class="sub">'+k.label+' · '+fmtSize(sizeOf(n))+'</div>'+(n.tags?'<div class="chips">'+n.tags.map(t=>{const x=TAGS.find(y=>y.id===t);return '<span><i style="background:'+x.color+'"></i>'+x.name+'</span>';}).join('')+'</div>':'')+'</div>';
    h+='<div class="btns"><button class="btn pri" data-act="open:'+n.id+'">'+ic('external',14)+'開く</button><button class="btn">'+ic('share',14)+'共有</button><button class="btn sqr">'+ic('more',16)+'</button></div>';
    h+='<dl class="props"><dt>更新日時</dt><dd>'+fmtFull(n.mod)+'</dd><dt>作成日時</dt><dd>'+fmtFull(n.created)+'</dd>'+(n.kind==='folder'?'<dt>内容</dt><dd>'+(n.children||[]).length+' 項目</dd>':'<dt>サイズ</dt><dd>'+Math.round(n.size).toLocaleString()+' バイト</dd>')+(n.dim?'<dt>解像度</dt><dd>'+n.dim+'</dd>':'')+(n.author?'<dt>作成者</dt><dd>'+esc(n.author)+'</dd>':'')+'<dt>場所</dt><dd>'+esc(ancestors(S.path).slice(1).map(a=>a.name).join(' › '))+'</dd></dl>';
  } else { const tot=sel.reduce((a,c)=>a+sizeOf(c),0);
    h+='<div class="frame" style="display:grid;place-items:center;aspect-ratio:16/11;position:relative">'+sel.slice(0,4).map((c,i)=>'<div style="position:absolute;transform:translate('+(i*18-27)+'px,'+(i%2?-6:6)+'px) rotate('+(i*6-9)+'deg);background:var(--surface);border-radius:10px;padding:9px;box-shadow:var(--shadow-2)">'+thumb(c,50)+'</div>').join('')+'</div><div><h2>'+sel.length+' 項目を選択</h2><div class="sub">合計 '+fmtSize(tot)+'</div></div><div class="btns"><button class="btn">'+ic('copy',14)+'コピー</button><button class="btn">'+ic('arrowR',14)+'移動</button><button class="btn sqr">'+ic('trash',15)+'</button></div>';
  }
  el.innerHTML=h+'</div>';
}
function st(){ const l=X.order(), sel=X.selectedNodes(), tot=sel.reduce((a,c)=>a+sizeOf(c),0); const c=node('c');
  $('st').innerHTML='<span>'+l.length+' 項目'+(S.q?'（「'+esc(S.q)+'」で絞り込み）':'')+'</span>'+(sel.length?'<span><b>'+sel.length+' 項目を選択</b> · '+fmtSize(tot)+'</span>':'')+'<span class="f"></span><span>ローカル ディスク (C:) 空き '+fmtSize(c.free)+'</span>';
  let t=document.querySelector('.toast'); if(S.toast){ if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=S.toast; } else if(t) t.remove(); }
X.setGridCols(()=>{ const g=document.querySelector('.content .grid'); return g?getComputedStyle(g).gridTemplateColumns.split(' ').length:1; });
X.setRender(()=>{ lt(); tabsR(); side(); tb(); content(); insp(); st(); });
addEventListener('resize',()=>X.render());
X.Review.mount('<p class="rv-note"><b>案3 Spaces（色のある場所）</b>— 場所ごとに色を持たせ（ドキュメント=朱、ピクチャ=ローズ、ダウンロード=緑…）、選択色・見出しの淡い色かぶり・タブの印がその色に切り替わる。上部はブラウザ型のタブ、本文は「フォルダーの棚＋日付ごとのまとまり」。暖かい紙色の面で、灰色の帯を使わない。</p><ul class="rv-note"><li>まとまりは 日付 / 種類 / なし で切替。キー移動は表示順（棚 → 各まとまり）に従う。</li><li>タブは試作として切替・追加・閉じるのみ。</li></ul>');
X.start();
})();
